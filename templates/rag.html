{% extends base_template %}
{% block content %}
<h2>📄 Knowledge Base (RAG)</h2>
<meta name="csrf-token" content="{{ csrf_token() }}">

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px;">
    
    <!-- Upload Column -->
    <div class="card">
        <h3 style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <span style="width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">📤</span>
            Upload Documents
        </h3>
        
        <input type="file" id="fileInput" multiple accept=".txt,.pdf,.json,.csv,.md" style="display: none;">
        
        <div id="dropZone" style="border: 2px dashed var(--border-subtle); border-radius: 16px; padding: 40px; text-align: center; transition: all 0.3s; cursor: pointer; background: rgba(0,0,0,0.1);">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">📁</div>
            <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 8px;">Drop your files here or click to browse</p>
            <p style="color: var(--text-muted); font-size: 0.8rem;">Supports .txt, .pdf, .json, .csv, .md</p>
        </div>
        
        <button id="uploadBtn" style="margin-top: 16px; width: 100%; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer;">Upload Documents</button>
        
        <div id="uploadProgressContainer" style="margin-top: 12px; display: none; background: rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; height: 8px;">
            <div id="uploadProgressBar" style="height: 100%; width: 0%; background: var(--accent-cyan); transition: width 0.3s;"></div>
        </div>
        <div id="uploadStatus" style="margin-top: 8px; font-size: 0.9rem; color: var(--text-muted); text-align: center;"></div>
    </div>

    <!-- Search Column -->
    <div class="card">
        <h3 style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <span style="width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">🔍</span>
            Search Knowledge
        </h3>
        <input type="text" id="searchQuery" placeholder="Ask about your documents..." style="margin-bottom: 12px; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-subtle); background: rgba(0,0,0,0.2); color: white;">
        <button id="searchBtn" style="width: 100%; background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan)); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer;">Search</button>
        
        <!-- Search Results Container -->
        <div id="searchResults" style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; padding-right: 5px;"></div>
    </div>
</div>

<!-- Modal for Viewing Full Text -->
<div id="textModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 15px;">
            <h3 id="modalTitle" style="margin: 0; color: var(--accent-cyan); font-size: 1.1rem;">Document Viewer</h3>
            <div>
                <a id="modalViewFileBtn" href="#" target="_blank" style="background: rgba(6,182,212,0.2); color: var(--accent-cyan); padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; margin-right: 10px; border: 1px solid var(--accent-cyan);">🔗 Open Raw File</a>
                <button onclick="closeModal()" style="background: transparent; color: white; border: 1px solid var(--border-subtle); padding: 8px 12px; border-radius: 6px; cursor: pointer;">✖ Close</button>
            </div>
        </div>
        <!-- Scrollable Modal Content -->
        <div id="modalContent" style="overflow-y: auto; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.8; white-space: pre-wrap; font-family: monospace; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;"></div>
    </div>
</div>

<script>
    // ─── UPLOAD LOGIC ───
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const progressContainer = document.getElementById('uploadProgressContainer');
    const progressBar = document.getElementById('uploadProgressBar');
    
    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--accent-cyan)';
        dropZone.style.background = 'rgba(6, 182, 212, 0.05)';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = 'var(--border-subtle)';
        dropZone.style.background = 'rgba(0,0,0,0.1)';
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border-subtle)';
        dropZone.style.background = 'rgba(0,0,0,0.1)';
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            handleFileSelect();
        }
    });

    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect() {
        if (fileInput.files.length) {
            selectedFiles = Array.from(fileInput.files);
            let displayText = selectedFiles.length === 1 
                ? `<p style="color: var(--accent-cyan); font-weight: 600;">${selectedFiles[0].name}</p>`
                : `<p style="color: var(--accent-cyan); font-weight: 600;">${selectedFiles.length} files selected</p>`;

            dropZone.innerHTML = `<div style="font-size: 2.5rem; margin-bottom: 12px;">📄</div>${displayText}<p style="color: var(--text-muted); font-size: 0.8rem;">Ready to upload</p>`;
            uploadStatus.innerHTML = '';
            progressContainer.style.display = 'none';
        }
    }

    uploadBtn.onclick = async () => {
        if (selectedFiles.length === 0) return;
        uploadBtn.disabled = true; uploadBtn.style.opacity = '0.5';
        progressContainer.style.display = 'block'; progressBar.style.width = '0%';
        
        let successCount = 0, failCount = 0;

        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            uploadStatus.innerHTML = `<span style="color: var(--accent-cyan);">⏳ Processing ${i+1} of ${selectedFiles.length}: ${file.name}...</span>`;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetchWithCSRF('/api/rag/upload', { method: 'POST', body: formData });
                if (res.ok) successCount++; else failCount++;
            } catch (err) { failCount++; }
            
            progressBar.style.width = `${Math.round(((i+1)/selectedFiles.length)*100)}%`;
        }

        uploadBtn.disabled = false; uploadBtn.style.opacity = '1';
        uploadStatus.innerHTML = failCount === 0 
            ? `<span style="color: var(--accent-green); font-weight: 600;">✅ Success!</span> Uploaded ${successCount} files.`
            : `<span style="color: #fbbf24; font-weight: 600;">⚠️ Partial:</span> ${successCount} ok, ${failCount} failed.`;

        setTimeout(() => {
            selectedFiles = []; fileInput.value = '';
            dropZone.innerHTML = `<div style="font-size: 2.5rem; margin-bottom: 12px;">📁</div><p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 8px;">Drop your files here or click to browse</p><p style="color: var(--text-muted); font-size: 0.8rem;">Supports .txt, .pdf, .json, .csv, .md</p>`;
            uploadStatus.innerHTML = ''; progressContainer.style.display = 'none';
        }, 4000);
    };

    // ─── SEARCH LOGIC & MODAL ───
    let currentSearchTerms = [];

    // Helper to highlight search terms
    function highlightText(text, terms) {
        if (!terms || terms.length === 0) return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        // Sort terms by length descending to match longest phrases first
        const sortedTerms = [...terms].sort((a, b) => b.length - a.length);
        sortedTerms.forEach(term => {
            if (term.length < 2) return; // ignore tiny words
            const regex = new RegExp(`(${term})`, 'gi');
            safeText = safeText.replace(regex, `<mark style="background: rgba(6, 182, 212, 0.4); color: white; border-radius: 4px; padding: 0 2px;">$1</mark>`);
        });
        return safeText;
    }

    document.getElementById('searchBtn').onclick = async () => {
        const query = document.getElementById('searchQuery').value.trim();
        const resultsDiv = document.getElementById('searchResults');
        
        if (!query) {
            resultsDiv.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Please enter a query.</p>';
            return;
        }

        // Split query into words for highlighting
        currentSearchTerms = query.split(' ').filter(w => w.length > 2);
        
        resultsDiv.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Searching...</p>';
        
        try {
            const res = await fetchWithCSRF('/api/rag/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const data = await res.json();
            
            if (!res.ok) {
                resultsDiv.innerHTML = `<p style="color: #ef4444; text-align: center;">Error: ${data.error}</p>`;
                return;
            }

            let html = '';
            if (data.documents && data.documents.length > 0) {
                for (let i = 0; i < data.documents.length; i++) {
                    const source = data.metadatas[i].source;
                    const score = data.metadatas[i].score.toFixed(2);
                    const rawText = data.documents[i];
                    
                    // Escape quotes for the onclick attribute to pass the text safely
                    const safeTextForOnclick = rawText.replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, "\\n");
                    
                    // Highlight text for the snippet preview
                    const highlightedText = highlightText(rawText, currentSearchTerms);

                    html += `
                        <div class="card" style="padding: 16px; margin: 0; background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle); border-radius: 8px; cursor: pointer; transition: border 0.2s;" 
                             onmouseover="this.style.borderColor='var(--accent-cyan)'" 
                             onmouseout="this.style.borderColor='var(--border-subtle)'"
                             onclick="openModal('${source}', '${safeTextForOnclick}')">
                            
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                <span style="width: 6px; height: 6px; background: var(--accent-cyan); border-radius: 50%; box-shadow: 0 0 8px var(--accent-cyan);"></span>
                                <strong style="color: var(--accent-cyan); font-size: 0.85rem;">${source}</strong>
                                <span style="color: var(--text-muted); font-size: 0.75rem; margin-left: auto;">Score: ${score}</span>
                            </div>
                            
                            <!-- Scrollable snippet container -->
                            <div style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; max-height: 120px; overflow-y: auto; padding-right: 5px;">
                                ${highlightedText}
                            </div>
                            
                            <div style="margin-top: 10px; font-size: 0.8rem; color: var(--accent-cyan); text-align: right;">
                                Click to read full section →
                            </div>
                        </div>
                    `;
                }
            } else {
                html = '<p style="color: var(--text-muted); text-align: center;">No results found.</p>';
            }
            resultsDiv.innerHTML = html;
            
        } catch (err) {
            resultsDiv.innerHTML = `<p style="color: #ef4444; text-align: center;">Network Error: ${err.message}</p>`;
        }
    };

    // ─── MODAL LOGIC ───
    function openModal(sourceName, textContent) {
        const modal = document.getElementById('textModal');
        const title = document.getElementById('modalTitle');
        const content = document.getElementById('modalContent');
        const viewBtn = document.getElementById('modalViewFileBtn');
        
        title.innerText = sourceName;
        // Unescape the \n back to actual newlines for the pre-wrap modal
        const displayText = textContent.replace(/\\n/g, '\n');
        content.innerHTML = highlightText(displayText, currentSearchTerms);
        
        // Link to view raw file (we just added this endpoint)
        viewBtn.href = `/api/rag/view/${encodeURIComponent(sourceName)}`;
        
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('textModal').style.display = 'none';
    }

    // Close modal if clicking outside the content box
    document.getElementById('textModal').addEventListener('click', (e) => {
        if (e.target.id === 'textModal') closeModal();
    });

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
</script>
{% endblock %}
